<div
    (mouseenter)="toggleActive()"
    (mouseleave)="toggleActive()"
    class="flex flex-column flex-align-center flex-justify-center p-8"
    [class.selected]="selected"
    [class.wall-angle-option-disabled]="disabled()"
    [class.wall-angle-option]="!disabled()"
    (click)="selectWallAngle()"
>
    <app-wall-angle-icon [wallAngle]="wallAngleData().wallAngle" [sgActive]="!disabled() && (active || selected)"></app-wall-angle-icon>
    <span>
        {{ wallAngleData().formattedWallAngle }}
    </span>
</div>
