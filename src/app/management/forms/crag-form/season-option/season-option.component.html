<div
    (mouseenter)="toggleActive()"
    (mouseleave)="toggleActive()"
    class="flex flex-column flex-align-center flex-justify-center p-8"
    [class.selected]="selected"
    [class.season-option-disabled]="disabled()"
    [class.season-option]="!disabled()"
    (click)="selectSeason()"
>
    <app-season-icon [season]="seasonData().season" [active]="!disabled() && (active || selected)"></app-season-icon>
    <span>
        {{ seasonData().formattedSeason }}
    </span>
</div>
