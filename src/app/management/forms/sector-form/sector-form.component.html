<div class="p-16">
    <h2>
        @if (data?.sector !== undefined) {
            Urejanje sektorja
        } @else {
            Dodajanje sektorja
        }
    </h2>
    <form [formGroup]="form">
        <div class="form flex flex-column gap-8">
            <mat-label>Ime sektorja</mat-label>
            <mat-form-field appearance="outline">
                <input matInput formControlName="label" />
                <mat-hint>npr. A - Centralni</mat-hint>
            </mat-form-field>
        </div>
        <mat-dialog-actions align="end">
            <div>
                @if (!saving) {
                    <button mat-flat-button [mat-dialog-close]="null">Prekliči</button>
                }
                @if (!saving) {
                    <button type="submit" class="primary-button" (click)="save()" [disabled]="!form.valid || form.pristine">Shrani</button>
                }
                @if (saving) {
                    <span class="loading">
                        <mat-spinner diameter="30"></mat-spinner>
                    </span>
                }
            </div>
        </mat-dialog-actions>
    </form>
</div>
