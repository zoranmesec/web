<section id="columns" fxLayout="column" fxLayoutGap="12px">
  <div class="flex flex-justify-space-between top">
    <div class="flex flex-row flex-align-center">
      <div>
        <app-columns-icon></app-columns-icon>
      </div>
      <div>
        <span class="p-l-4">Izberi stolpce</span>
      </div>
    </div>
    <div class="close-icon" (click)="closeFilters()">
      <app-close-icon></app-close-icon>
    </div>
  </div>
  @if (columnForm) {
  <div class="p-16">
    <form [formGroup]="columnForm">
      <ul>
        @for (column of allColumnsArray; track $index) {
        <li>
          <label class="checkbox-container">
            <input type="checkbox" [formControlName]="column.field" />
            <span class="checkmark"></span
            ><span class="checkmark-label" *ngIf="column.field === 'starRating'"
              ><mat-icon>star</mat-icon>{{ column.selectLabel }}</span
            ><span class="checkmark-label" *ngIf="column.field === 'multipitch'"
              ><mat-icon svgIcon="multipitch"></mat-icon
              >{{ column.selectLabel }}</span
            ><span class="checkmark-label" *ngIf="column.field === 'comments'"
              ><mat-icon>comment</mat-icon>{{ column.selectLabel }}</span
            ><span class="checkmark-label" *ngIf="column.field === 'myAscents'"
              ><mat-icon>check</mat-icon>{{ column.selectLabel }}</span
            ><span
              class="checkmark-label"
              *ngIf="
                column.field !== 'starRating' &&
                column.field !== 'multipitch' &&
                column.field !== 'comments' &&
                column.field !== 'myAscents'
              "
              >{{ column.selectLabel }}</span
            >
          </label>
          <!-- 
          <input type="checkbox" />
          <span class="checkmark"></span>
        </label> -->
        </li>
        }
      </ul>
    </form>
  </div>
  }

  <div
    class="flex flex-justify-space-between bottom show-all"
    (click)="resetColumns()"
  >
    <div class="flex flex-row flex-align-center reset-all">
      <div class="close-icon">
        <mat-icon class="map-icon">refresh</mat-icon>
      </div>
      <div>
        <span class="p-l-4">Ponastavi vse</span>
      </div>
    </div>
  </div>
</section>
