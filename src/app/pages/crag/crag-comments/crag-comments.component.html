<main class="m-l-8 m-r-8">
  <section id="form" class="m-b-16 m-t-16 w-100">
    <app-comment-form
      [entity]="crag"
      (commentSaved)="onCommentSaved($event)"
    ></app-comment-form>
  </section>
  <section id="comments">
    <ng-container *ngFor="let comment of comments">
      <app-comment [comment]="comment"></app-comment>
    </ng-container>
  </section>
</main>
