<app-data-error *ngIf="error" [error]="error"></app-data-error>

<app-loader *ngIf="loading"></app-loader>

@if (!error && !loading) {

<section id="title">
  <h1>{{ crag.name }}</h1>
</section>
<section id="tabs">
  <div>&nbsp;</div>
  @for (tab of tabs; track $index) {
  <div [class.active]="tab.slug == activeTab" (click)="setActiveTab(tab)">
    <mat-icon svgIcon="{{ tab.icon }}" class="map-icon"></mat-icon>
    <span>
      {{ tab.label }}
    </span>
  </div>
  <div>&nbsp;</div>
  }
  <div>&nbsp;</div>
</section>
<section class="m-16">
  <app-crag-info [crag]="crag" *ngIf="activeTab == 'info'"></app-crag-info>
  <app-crag-routes [crag]="crag" *ngIf="activeTab == 'smeri'"></app-crag-routes>

  <app-crag-comments
    [crag]="crag"
    *ngIf="activeTab == 'komentarji'"
    [action]="action$"
  ></app-crag-comments>

  <app-crag-gallery
    [cragId]="crag.id"
    [images]="crag.images"
    *ngIf="activeTab == 'galerija'"
  ></app-crag-gallery>
</section>
}
