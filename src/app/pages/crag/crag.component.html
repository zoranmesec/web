<app-data-error *ngIf="error" [error]="error"></app-data-error>

<app-loader *ngIf="loading"></app-loader>

@if (!error && !loading) {

<section id="title">
  <h1>{{ crag.name }}</h1>
</section>
<section id="tabs">
  <div>&nbsp;</div>
  @for (tab of tabs; track $index) {
  <div [class.active]="tab.slug === activeTab" (click)="setActiveTab(tab)">
    @if (tab.icon==='route') {
    <app-routes-icon [active]="tab.slug === activeTab"></app-routes-icon>
    } @else if (tab.icon==='image') {
    <app-gallery-icon [active]="tab.slug === activeTab"></app-gallery-icon>
    } @else if (tab.icon==='info') {
    <app-info-icon [active]="tab.slug === activeTab"></app-info-icon>
    } @else if (tab.icon==='comment') {
    <app-comment-icon [active]="tab.slug === activeTab"></app-comment-icon>
    }

    <span fxHide.lt-md>
      {{ tab.label }}
    </span>
  </div>
  <div>&nbsp;</div>
  }
  <div>&nbsp;</div>
</section>
<section [class.m-16]="breakpointService.gtMd() && activeTab !== 'galerija'">
  <app-crag-info [crag]="crag" *ngIf="activeTab == 'info'"></app-crag-info>
  <app-crag-routes [crag]="crag" *ngIf="activeTab == 'smeri'"></app-crag-routes>

  <app-crag-comments
    [crag]="crag"
    *ngIf="activeTab === 'komentarji'"
    [action]="action$"
    class="m-t-16"
  ></app-crag-comments>

  <app-crag-gallery
    [crag]="crag"
    [images]="crag.images"
    *ngIf="activeTab === 'galerija'"
  ></app-crag-gallery>
</section>
}
