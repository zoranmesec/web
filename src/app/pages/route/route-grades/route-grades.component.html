<mat-accordion>
  <mat-expansion-panel expanded="true">
    <mat-expansion-panel-header>
      <mat-panel-title> Glasovi o težavnosti </mat-panel-title>
    </mat-expansion-panel-header>
    <app-distribution-chart
      class="m-t-16"
      [distribution]="gradesDistribution"
      [useGreyBackground]="false"
      [useColorBars]="false"
    ></app-distribution-chart>
    <div *ngIf="grades.length > 0" class="grades-list p-t-8" fxLayout="column">
      <div
        *ngFor="let grade of grades"
        [class.grade-included-in-calc]="grade.includedInCalculation"
        [class.grade-not-included-in-calc]="!grade.includedInCalculation"
        class="flex flex-row p-4"
      >
        <app-grade
          class="grade"
          [difficulty]="grade.difficulty"
          [gradingSystemId]="gradingSystemId"
          [legacy]="true"
        ></app-grade>
        <div class="grade-user p-l-8">
          <ng-container *ngIf="grade.isBase && !grade.user"
            >Bazna ocena</ng-container
          >
          <ng-container *ngIf="grade.user"
            >{{ grade.user.firstname + " " + grade.user.lastname }}
          </ng-container>
        </div>
        <div class="grade-date">{{ grade.created | date : "d. M. yyyy" }}</div>
      </div>
    </div>
  </mat-expansion-panel>
</mat-accordion>
