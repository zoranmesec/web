<div class="flex flex-row flex-align-center flex-justify-space-around">
  <ng-container *ngFor="let button of data.buttons">
    <button mat-flat-button (click)="snackBarRef.closeWithAction()">
      {{ button.label }}
    </button>
  </ng-container>
  <div class="close-icon" (click)="closeDialog()">
    <mat-icon matIcon color="red" class="map-icon">close</mat-icon>
  </div>
</div>
