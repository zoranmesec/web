<div class="flex flex-row flex-align-center flex-justify-space-around">
    @for (button of data.buttons; track button) {
        <button class="primary-button" (click)="snackBarRef.closeWithAction()">
            {{ button.label }}
        </button>
    }
    <button class="quaternary-button" (click)="closeDialog()">
        <app-close-icon></app-close-icon>
    </button>
</div>
