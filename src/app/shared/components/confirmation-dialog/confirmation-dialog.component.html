<div class="p-16">
    <h2 mat-dialog-title>{{ data.title }}</h2>
</div>
<mat-dialog-content>
    {{ data.message }}
    @if (data.finePrint) {
        <div class="fine-print" [innerHtml]="data.finePrint"></div>
    }
</mat-dialog-content>
<mat-dialog-actions align="end" class="p-t-32">
    <button type="button" class="secondary-button" [mat-dialog-close]="null">Prekliči</button>
    <button class="primary-button" cdkFocusInitial [mat-dialog-close]="true">Potrdi</button>
</mat-dialog-actions>
