@if (grade) {
    <div class="flex flex-row align-items-center">
        <span class="grade-name">{{ grade.name }}</span>
        @if ((showModifier | signalPipe) && grade.modifier === 1) {
            <span class="grade-modifier hard m-t-8" [ngClass]="{ disabled: (disabled | signalPipe) }">
                <mat-icon>arrow_drop_up</mat-icon>
            </span>
        }
        @if ((showModifier | signalPipe) && grade.modifier === -1) {
            <span class="grade-modifier soft" [ngClass]="{ disabled: (disabled | signalPipe) }">
                <mat-icon>arrow_drop_down</mat-icon>
            </span>
        }
    </div>
}
