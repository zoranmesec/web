<mat-dialog-content class="mat-typography">
  <div class="mt-16 flex flex-row flex-justify-space-between">
    <div class="py-8">
      <h2>Vnos v plezalni dnevnik</h2>
    </div>
    <div>
      <mat-dialog-actions>
        <button mat-button mat-dialog-close>Prekliči</button>
      </mat-dialog-actions>
    </div>
  </div>

  <ng-container>
    <div class="container mt-16">
      <app-activity-form
        [crag]="crag"
        [peak]="peak"
        [iceFall]="iceFall"
        [selectedRoutes]="routes"
      ></app-activity-form>
    </div>
  </ng-container>

  <ng-container *ngIf="type == 'crag' && !routes.length">
    <div class="container mt-16">
      Izgleda, da nimaš izbranih smeri za vpis v dnevnik.
      <br />
      <br />
      Vrni se <a [routerLink]="['/']">domov</a>, na
      <a [routerLink]="['/plezalni-dnevnik']">plezalni dnevnik</a> ali na
      <a [routerLink]="['/plezalisca/slovenija', { type: 'sport' }]"
        >plezališča</a
      >.
    </div>
  </ng-container>
</mat-dialog-content>
