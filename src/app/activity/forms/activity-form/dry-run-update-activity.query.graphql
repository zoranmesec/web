query DryRunUpdateActivity(
  $input: UpdateActivityInput!
  $routes: [UpdateActivityRouteInput!]!
) {
  dryRunUpdateActivity(input: $input, routes: $routes) {
    before {
      date
      ascentType
      routeId
      route {
        name
      }
    }
    after {
      date
      ascentType
      routeId
    }
  }
}
